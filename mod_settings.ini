[Mod]
Id = WardrobeTransmog
Name = Style Without Sacrifice - Your Transmogrification Wardrobe
Author = my-mods
Version = 1.2.2
Description = Choose your outfit in the Wardrobe tab.

[Setting.enabled]
Id = enabled
Type = toggle
Label = Enabled
Description = Enable your selected wardrobe appearances.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = enabled

[Setting.openKey]
Id = openKey
Type = picker
Label = Wardrobe shortcut
Description = Open or close the Wardrobe tab.
Group = General
PresetValues = 0|1|2|3
PresetLabels = End|F7|F8|F9
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = openKey

[Setting.controllerGlyphs]
Id = controllerGlyphs
Type = picker
Label = Controller Glyphs
Description = Choose Wardrobe button symbols. Auto follows keyboard or controller input using Xbox symbols; select PS5 for PlayStation symbols. This changes prompts only.
Group = General
PresetValues = 0|1|2|3
PresetLabels = Auto|Keyboard|Xbox|PS5
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = controllerGlyphs

[Setting.logLevel]
Id = logLevel
Type = picker
Label = Logging
Description = Cumulative diagnostic detail in UE4SS.log. Warning is the default; Off silences this mod; Debug includes event traces and timings.
Group = General
PresetValues = 0|1|2|3|4
PresetLabels = Off|Error|Warning|Info|Debug
Default = 2
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = logLevel
