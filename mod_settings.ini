[Mod]
Id = WardrobeTransmog
Name = Style Without Sacrifice - Your Transmogrification Wardrobe
Author = oOCamilleOo
Version = 1.1.3
AuthorURL = https://www.nexusmods.com/users/933214
ModURL = https://www.nexusmods.com/thebloodofdawnwalker/mods/721
LogoFile = assets/Logo_StyleWithoutSacrifice.png
Description = A Wardrobe tab for your equipment's appearance, with separate day and night outfits, saved presets, a character preview and Mod Setting Menu controls.

[Setting.enabled]
Id = enabled
Type = toggle
Label = Enabled
Description = Enable your selected wardrobe appearances.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = enabled

[Setting.openKey]
Id = openKey
Type = picker
Label = Wardrobe shortcut
Description = Open or close the Wardrobe tab.
Group = General
PresetValues = 0|1|2|3
PresetLabels = End|F7|F8|F9
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = openKey

[Setting.logLevel]
Id = logLevel
Type = picker
Label = Logging
Description = Cumulative diagnostic detail in UE4SS.log. Warning is the default; Off silences this mod; Debug includes event traces and timings.
Group = General
PresetValues = 0|1|2|3|4
PresetLabels = Off|Error|Warning|Info|Debug
Default = 2
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = logLevel
